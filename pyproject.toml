[project]
name = "paarbench"
version = "0.0.1"
description = "PlanActAdaptRepeatBench - a benchmark for test-time adaptation of latent world models"
readme = "README.md"
# Pinned to 3.9 so existing checkpoints and evaluation numbers remain comparable.
requires-python = "==3.9.*"

dependencies = [
    # CUDA 12.1 is part of the benchmark's reproducible runtime.
    "torch==2.3.0+cu121",
    "torchvision==0.18.0+cu121",

    # config / experiment plumbing
    "hydra-core==1.2.0",
    "omegaconf==2.3.0",
    "antlr4-python3-runtime==4.9.3",
    "submitit==1.5.1",
    "hydra-submitit-launcher==1.2.0",
    "wandb==0.17.0",

    # numerics
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.0",
    "einops==0.4.1",

    # PushT / PushObj simulation
    "gym==0.23.1",
    "pygame==2.5.2",
    "pymunk==6.8.0",
    "shapely==2.0.3",
    "opencv-python==4.6.0.66",
    "scikit-image==0.19.3",
    "Pillow==10.3.0",

    # data / IO
    "h5py>=3.14.0",
    "decord==0.6.0",
    "imageio==2.34.1",
    "imageio-ffmpeg==0.4.9",
    "moviepy==1.0.3",
    "matplotlib==3.5.3",
    "PyYAML==6.0.1",
    "tqdm==4.67.1",
    "psutil==5.9.8",
    "accelerate==0.26.1",
    "huggingface-hub>=1.0,<2",
    "PyOpenGL==3.1.7",

    # metrics / harness output schema
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
maze = [
    # The released AdaJEPA maze bases use Gym's legacy MuJoCoEnv API.
    "mujoco==3.2.7",
    "mujoco-py==2.1.2.14",
    # mujoco-py cannot compile against Cython 3.
    "Cython<3",
]

[tool.uv]
# The repo is run in place (`.venv/bin/python plan.py ...`), not installed, so
# there is nothing to build for the root project.
package = false
# Linux/x86_64 only: the CUDA wheels and benchmark runtime target this platform.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
# The default run is the GPU-free suite: a couple of seconds, safe for CI on any
# machine.  Integration tests load a real base world model and need a staged
# checkpoint, so they are opt-in with `-m integration`.
addopts = "-m 'not integration'"
pythonpath = ["."]
markers = [
    "integration: needs a staged base checkpoint (and usually a GPU)",
]
