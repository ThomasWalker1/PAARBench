schema_version: 1

benchmark:
  name: PAARBench
  version: 0.0.1
  description: >-
    PlanActAdaptRepeatBench (PAARBench) evaluates test-time adaptation strategies
    for latent world models in closed-loop control. Each submission declares at most
    two tunable hyperparameters; the harness sweeps a 3-point grid per axis on a
    fixed selection cohort (up to two boundary expansions), freezes the best
    configuration, and evaluates once on held-out test cohorts. Results are a metric
    frontier (success, paired distance change, catastrophe, compounding, regret,
    adaptation latency, peak memory, selection cost), not a single aggregate rank.

license: MIT

evaluation:
  # Declared protocol command; Turtle validators record it and do not execute it.
  # Replace <method> and <setting> with a methods/ directory name and a setting id.
  command: .venv/bin/python scripts/evaluate.py <method> --setting <setting> --gpus 0,1,2,3
  # Schema-required scalar declaration only. PAARBench does not collapse its frontier
  # into one ranking metric; compare settings and columns separately.
  primary_metric: success
  direction: maximize

resources:
  gpu_required: true
  timeout_minutes: 720
  # Checkpoint and optional dataset downloads use the network; standard evaluation
  # itself runs from staged local artifacts once those downloads are complete.
  network_required: true

baseline:
  name: frozen
  command: .venv/bin/python scripts/evaluate.py --frozen --setting pushobj --gpus 0,1,2,3

paths:
  readme: README.md
  license: LICENSE
  evaluator: paarbench
  baselines: results/frozen
  tests: tests

# Distinct scientific settings. Do not compare these as one collapsed scalar.
settings:
  - id: pushobj
    primary_metric: success
    direction: maximize
    description: >-
      Selectable PushObj setting (base pushobj_shape_shift; shapes T/L/Z/+).
      Selection cohort seed 300; held-out test seeds 100, 200, 400. Reports the
      multi-objective frontier in LEADERBOARD.md, not a single rank.
  - id: pushobj_shift
    primary_metric: success
    direction: maximize
    description: >-
      Held-out shape condition (shapes I/small_tee/square) on the same base model.
      Not independently selectable: methods inherit hyperparameters frozen on
      pushobj. Same frontier metrics; not comparable to other settings as one scalar.
  - id: pusht
    primary_metric: success
    direction: maximize
    description: >-
      Selectable PushT setting (base pusht_visual_shift; shapes T/L/Z). Selection
      cohort seed 100; held-out test seeds 200, 400. Same multi-objective frontier;
      not comparable to other settings as one scalar.
