name: point_maze
save_name: umaze
args: []
kwargs: {}

dataset:
  _target_: "datasets.point_maze_dset.load_point_maze_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/point_maze
  split_ratio: 0.9
  use_preprocessed: false
  use_frame_files: true
  use_hdf5: false
  hdf5_path: null
  hdf5_cache_mb: 256
  hdf5_cache_nslots: 200003
  hdf5_cache_w0: 0.75
  # Keep the reference TrajSlicerDataset's full random permutation. Nonzero
  # values are locality-oriented I/O ablations, not baseline training.
  shuffle_block_size: 0
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16
prefetch_factor: 4
