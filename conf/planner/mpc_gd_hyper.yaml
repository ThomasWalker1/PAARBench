_target_: planning.mpc.MPCPlanner
max_iter: 20
n_taken_actions: 5
sub_planner:
  target: planning.gd.GDPlanner
  horizon: 25
  action_noise: 0
  sample_type: zero
  lr: 0.1
  opt_steps: 100
  eval_every: -1
hyper_adaptation:
  enabled: true
  context_mode: hist_frames
  context_feature_kind: residual_action
  target_scope: predlast_all
  rank: 4
  lora_scale: 1.0
  freeze_lora_A: false
  fixed_a_scale: 1.0
  hidden_dim: 512
  depth: 2
  init_scale: 0.0
  checkpoint_path: null
  refresh: episode_start
  freeze_base: true
  log_prefix: hyperjepa
name: mpc_gd_hyper
