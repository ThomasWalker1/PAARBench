name: hover
display_name: "HOVER — horizon-matched online TTA"
description: >
  Online gradient adaptation of the same correction AdaJEPA uses -- a rank-2 LoRA plus
  LayerNorm delta on the predictor's last block -- fitted to the open-loop latent
  rollout the planner actually solves through rather than to single-step prediction,
  and braked by evidence it has not seen. Before each update the current correction is
  scored against the frozen predictor on the transition that just arrived, which the
  previous update was fitted before; when it is worse there by more than brake_ratio
  the delta is reset to zero and the optimizer rebuilt, so a correction that fresh
  prediction error says is hurting stops compounding. Target latents are cached
  (the encoder is never adapted), so a gradient step costs predictor forwards only.
reference: "This repository; correction and optimizer follow methods/adajepa."

adapter: adapter:HoverAdapter
settings: [pushobj, pushobj_shift, pusht]

# Owns mutable shared state -- predictor LoRA parameters and an AdamW trajectory -- so
# a batched cohort would average unrelated episodes into one correction. Same reason
# AdaJEPA declares it.
requires_episode_isolation: true

params:
  steps: 5
  pred_lr: 2.0e-3
  horizon: 3
  buffer_size: 8
  # Parameterization held identical to AdaJEPA's tuned arm on purpose: the comparison
  # is meant to be about the objective and the brake, not about capacity.
  target_scope: predlast_all
  lora_rank: 2
  lora_scale: 1.0
  # The only stochastic element in the method. Seeded and declared because the paired
  # metrics compare episode against episode, so the planner's determinism is
  # load-bearing and the adapter must not undo it.
  lora_init_seed: 0
  # Without clipping, repeated steps per replan over 20 replans diverge; inherited
  # from AdaJEPA's configuration rather than re-derived.
  grad_clip_norm: 1.0
  brake_ratio: 1.25
  refresh_interval: 1
  require_single_episode: true

# Two axes, 9 initial cells -- the same selection cost as AdaJEPA, so the two rows are
# priced identically. `steps` is authored at 5 rather than tuned: that is the value
# AdaJEPA's own selection chose on all three settings it was tuned on, and spending an
# axis to rediscover it would leave the mechanism this method is about untested.
# `horizon: 1` is a single-step objective, i.e. the grid contains an AdaJEPA-like arm
# instead of assuming the multi-step one wins.
tunable:
  axes:
    pred_lr:
      initial: [5.0e-4, 2.0e-3, 1.0e-2]
      scale: log
    horizon:
      initial: [1, 3, 5]
      scale: discrete
      pool: [1, 2, 3, 5, 8]
