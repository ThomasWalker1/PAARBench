name: restore_tta
display_name: "Restore TTA — online gradient TTA with stochastic restoration"
description: >
  Online gradient adaptation of the world model's prediction loss over executed
  transitions, with stochastic restoration after every optimizer update. Each
  optimizable scalar is reset to its pretrained value independently with probability
  p, leaking the accumulating correction back toward the base model to test whether
  it flattens the compounding slope without sacrificing success.
reference: "Wang et al., 'Continual Test-Time Domain Adaptation', CVPR 2022 (restoration mechanism only)"

adapter: adapter:RestoreTTAAdapter
settings: [pushobj, pushobj_shift, pusht]

# This method owns model weights and AdamW state. Batched cohorts would average
# unrelated episodes into one update, so the harness must isolate every episode.
requires_episode_isolation: true

# Keep AdaJEPA's validated rank-2 online-update configuration fixed and select
# only p. The reported four-column cost is thus attributable to restoration rather
# than quietly repeating a 16-cell step-size search.
params:
  steps: 10
  pred_lr: 5.0e-4
  update_scope: lora_predlast_all
  lora_rank: 2
  lora_scale: 1.0
  buffer_size: 5
  buffer_strategy: recent
  refresh_interval: 1
  enc_lr: 1.0e-5
  action_lr: 5.0e-4
  stop_grad: true
  grad_clip_norm: 1.0
  require_single_episode: true
  restore_probability: 0.01

selection: selection:RestorationGrid

