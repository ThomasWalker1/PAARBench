name: adajepa_v2_ia3
display_name: "AdaJEPA v2 · (IA)³ — v2 fitting rule, multiplicative rescaling"
description: >
  AdaJEPA v2 with the rank-2 LoRA replaced by (IA)³: per-feature rescaling (1 + s) of the attention keys and values and of the MLP hidden activation on the predictor's last block, plus the same LayerNorm delta. 4,904 correction parameters instead of 20,424. The correction can only rescale features the frozen block already computes; it cannot add a direction. Everything else -- the horizon-matched fit, the fresh-evidence brake, AdamW, clipping, the two tuned axes -- is the adajepa_v2 row, unchanged.
reference: 'Liu et al., 2022, "Few-Shot Parameter-Efficient Fine-Tuning is Better and Cheaper than In-Context Learning", arXiv:2205.05638. Fitting rule: methods/adajepa_v2'

adapter: adapter:AdaJEPAv2Adapter
settings: [pushobj, pushobj_shift, pusht, maze_medium, maze_medium_low_density, maze_medium_high_damping, maze_diverse]

# Owns mutable shared state -- predictor correction parameters and an AdamW trajectory
# -- so a batched cohort would average unrelated episodes into one correction. Same
# reason adajepa_v2 declares it.
requires_episode_isolation: true

# Identical to adajepa_v2's params except correction_shape and log_prefix. The point of
# the row is that the shape is the only thing that changes, so nothing else is retuned
# by hand: the selection grid below is v2's, at v2's selection cost.
params:
  correction_shape: ia3   # (IA)³ on the to_qkv keys and values and the MLP hidden activation; see models/shapes.py.
  steps: 5
  pred_lr: 2.0e-3
  horizon: 5
  buffer_size: 8
  target_scope: predlast_all
  lora_rank: 2
  lora_scale: 1.0
  lora_init_seed: 0
  grad_clip_norm: 1.0
  brake_ratio: 1.25
  refresh_interval: 1
  require_single_episode: true
  log_prefix: adajepa_v2_ia3

# v2's two axes and initial grid, unchanged. A shape with a different gradient scale
# may want a different learning rate; boundary expansion is how the protocol finds it,
# and the extra columns are counted in the selection cost.
tunable:
  axes:
    pred_lr:
      initial: [5.0e-4, 2.0e-3, 1.0e-2]
      scale: log
    horizon:
      initial: [1, 3, 5]
      scale: discrete
      pool: [1, 2, 3, 5, 8]
