name: adajepa_v2
display_name: "AdaJEPA v2 — horizon-matched fit + fresh-evidence brake"
description: >
  Version 2 of the adajepa row, not a separate family: the same correction (rank-2 LoRA
  plus LayerNorm delta on the predictor's last block), the same AdamW, the same
  clipping, the same selection cost. What changes is how it is fitted. The loss is the
  open-loop latent rollout the planner actually solves through -- horizon steps under
  the executed actions, against the states the environment reached -- rather than one
  step from one frame. And the update is braked by evidence it has not seen: before
  each update the current correction is scored against the frozen predictor on the
  transition that just arrived, which the previous update was fitted before, and when
  it is worse there by more than brake_ratio the delta is reset to zero and the
  optimizer rebuilt. Target latents are cached (the encoder is never adapted), so a
  gradient step costs predictor forwards only.
reference: "v1: methods/adajepa. Published implementation: github.com/agentic-learning-ai-lab/adajepa"

adapter: adapter:AdaJEPAv2Adapter
settings: [pushobj, pushobj_shift, pusht]

# Owns mutable shared state -- predictor LoRA parameters and an AdamW trajectory -- so
# a batched cohort would average unrelated episodes into one correction. Same reason
# v1 declares it.
requires_episode_isolation: true

params:
  steps: 5
  pred_lr: 2.0e-3
  horizon: 5
  buffer_size: 8
  # Parameterization held identical to v1's tuned arm on purpose: the comparison is
  # meant to be about the fitting rule and the brake, not about capacity.
  target_scope: predlast_all
  lora_rank: 2
  lora_scale: 1.0
  # The only stochastic element in the method. Seeded and declared because the paired
  # metrics compare episode against episode, so the planner's determinism is
  # load-bearing and the adapter must not undo it.
  lora_init_seed: 0
  # Without clipping, repeated steps per replan over 20 replans diverge; inherited
  # from v1's configuration rather than re-derived.
  grad_clip_norm: 1.0
  brake_ratio: 1.25
  refresh_interval: 1
  require_single_episode: true

# Two axes, 9 initial cells -- the same selection cost as v1, so the two rows are
# priced identically. `steps` is authored at 5 rather than tuned: that is the value
# v1's own selection chose on all three settings it was tuned on, and spending an axis
# to rediscover it would leave the mechanism this version is about untested.
# `horizon: 1` is v1's single-step objective, i.e. the grid contains a v1-like arm
# instead of assuming the multi-step one wins.
tunable:
  axes:
    pred_lr:
      initial: [5.0e-4, 2.0e-3, 1.0e-2]
      scale: log
    horizon:
      initial: [1, 3, 5]
      scale: discrete
      pool: [1, 2, 3, 5, 8]
