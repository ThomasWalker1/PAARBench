name: hyper_ia3
display_name: "Hyper-(IA)³ — amortized hypernetwork, (IA)³ correction"
description: >
  HyperLoRA with the generated correction changed from rank-2 LoRA to per-feature rescaling (1 + s) of the attention keys and values and of the MLP hidden activation, plus the final LayerNorm delta.
  4,904 generated numbers per episode (HyperLoRA: 20,424). It is multiplicative and starts at no change, so it can only rescale features the frozen block already computes. The context
  encoder, generator architecture, training recipe, refresh rule and selection axis are
  hyperlora's, unchanged; only the emitted shape differs. Its control is static_ia3.
reference: "Liu et al., 2022, arXiv:2205.05638 ((IA)³); amortized generation: methods/hyperlora"

adapter: adapter:HyperLoRAAdapter
settings: [pushobj, pushobj_shift, pusht, maze_medium, maze_medium_low_density, maze_medium_high_damping, maze_diverse]

# Must match the checkpoint's metadata.json; the adapter checks correction_shape, rank,
# scope and context settings on load and raises on a mismatch.
params:
  checkpoint_path: checkpoints/pushobj_adapters/hyper_ia3_r2/hyper_lora_epoch_2.pth
  correction_shape: ia3
  rank: 2

  target_scope: predlast_all
  context_mode: transition_buffer
  context_feature_kind: residual_action
  context_aggregator: transformer_query
  transition_buffer_size: 5
  adapter_gate: false
  freeze_lora_A: false
  generator: mlp
  refresh: every_mpc
  refresh_interval: 1
  fold_weights: false
  log_prefix: hyper_ia3

# The default above is a placeholder that selection overwrites through maps_to.
params_by_setting:
  pushobj_shift:
    checkpoint_path: checkpoints/pushobj_adapters/hyper_ia3_r2/hyper_lora_epoch_2.pth
  pusht:
    checkpoint_path: checkpoints/pvs_adapters/hyper_ia3_r2/hyper_lora_epoch_2.pth
  maze_medium:
    checkpoint_path: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_2.pth
  maze_medium_low_density:
    checkpoint_path: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_2.pth
  maze_medium_high_damping:
    checkpoint_path: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_2.pth
  maze_diverse:
    checkpoint_path: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_2.pth

# hyperlora's axis: which training epoch to deploy, chosen on the selection cohort.
tunable:
  axes:
    training_epoch:
      scale: discrete
      initial: [1, 2, 3]
      pool_by_setting:
        pushobj: [1, 2, 3, 4, 5]
        pushobj_shift: [1, 2, 3, 4, 5]
        pusht: [1, 2, 3, 4, 5]
        maze_medium: [1, 2, 3, 4, 5]
        maze_medium_low_density: [1, 2, 3, 4, 5]
        maze_medium_high_damping: [1, 2, 3, 4, 5]
        maze_diverse: [1, 2, 3, 4, 5]
      maps_to:
        param: checkpoint_path
        by_setting:
          pushobj: checkpoints/pushobj_adapters/hyper_ia3_r2/hyper_lora_epoch_{}.pth
          pushobj_shift: checkpoints/pushobj_adapters/hyper_ia3_r2/hyper_lora_epoch_{}.pth
          pusht: checkpoints/pvs_adapters/hyper_ia3_r2/hyper_lora_epoch_{}.pth
          maze_medium: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_{}.pth
          maze_medium_low_density: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_{}.pth
          maze_medium_high_damping: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_{}.pth
          maze_diverse: checkpoints/maze_medium_adapters/hyper_ia3_r2/hyper_lora_epoch_{}.pth
