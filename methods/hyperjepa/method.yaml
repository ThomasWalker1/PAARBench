name: hyperjepa
display_name: "HyperJEPA — amortized hypernetwork"
description: >
  A hypernetwork reads the transitions the controller has executed this episode and
  emits a rank-2 LoRA correction for the predictor's last block. The correction is
  regenerated from the frozen weights before every replan rather than accumulated,
  so adaptation cost is O(1) in the number of replans and the update cannot drift.
  Contrast with adajepa, which walks an optimizer trajectory.
reference: "Predecessor project ~/HyperJEPA, planning/hyper_adapter.py @ 628dff7"

adapter: adapter:HyperJEPAAdapter
settings: [pushobj, pushobj_shift, pusht]

# These MUST match the adapter checkpoint's metadata.json. The adapter validates
# them on load and raises rather than mis-loading silently -- several mismatches
# leave every tensor shape valid, so strict state-dict loading would not catch them.
# See docs/CHECKPOINTS.md.
params:
  checkpoint_path: checkpoints/pushobj_adapters/hyper_r2_distill0/hyper_lora_epoch_2.pth
  rank: 2

  target_scope: predlast_all
  context_mode: transition_buffer
  context_feature_kind: residual_action
  context_aggregator: transformer_query
  transition_buffer_size: 5
  adapter_gate: false
  freeze_lora_A: false
  generator: mlp
  refresh: every_mpc
  refresh_interval: 1
  fold_weights: false

tunable:
  axes:
    training_epoch:
      scale: discrete
      initial: [1, 2, 3]
      pool_by_setting:
        pushobj: [1, 2, 3, 4, 5]
        pushobj_shift: [1, 2, 3, 4, 5]
        pusht: [1, 2, 3, 4]
      maps_to:
        param: checkpoint_path
        by_setting:
          pushobj: checkpoints/pushobj_adapters/hyper_r2_distill0/hyper_lora_epoch_{}.pth
          pushobj_shift: checkpoints/pushobj_adapters/hyper_r2_distill0/hyper_lora_epoch_{}.pth
          pusht: checkpoints/pvs_adapters/hyper_r2_distill0/hyper_lora_epoch_{}.pth

# The architecture is shared across domains; the trained weights are not. PushT has
# its own hypernetwork, trained on the pusht_visual_shift base.
params_by_setting:
  pusht:
    # Epoch 3, chosen by EpochSelection on the pusht selection cohort (0.460 over
    # 0.413/0.440/0.447). This previously read hyper_lora_best.pth -- a checkpoint the
    # declared rule never considers and whose "best" was decided somewhere outside this
    # benchmark. Running the rule for real is what surfaced that.
    checkpoint_path: checkpoints/pvs_adapters/hyper_r2_distill0/hyper_lora_epoch_3.pth
